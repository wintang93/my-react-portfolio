name = "ask-sherwin-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Origins allowed to call this Worker (CORS). Update if your site URL changes.
[vars]
ALLOWED_ORIGINS = "https://wintang93.github.io,http://localhost:3000"

# ANTHROPIC_API_KEY is NOT set here — it's a secret. Set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY

# KV namespace for logging brand-new questions not covered by the FAQ.
# Create it once (free tier), then paste the printed id below:
#   npx wrangler kv namespace create NOVEL_QUESTIONS
#   npx wrangler kv namespace create NOVEL_QUESTIONS --preview   # for `wrangler dev`
[[kv_namespaces]]
binding = "NOVEL_QUESTIONS"
id = "0aec347015c1439ab1470fc2026dc78e"
preview_id = "5c7df202aac5477e9b1fe458d7776fe6"

# KV namespace for the portfolio Visit Tracker (cross-visitor analytics).
# Create it once (free tier), then paste the printed ids below:
#   npx wrangler kv namespace create ANALYTICS
#   npx wrangler kv namespace create ANALYTICS --preview          # for `wrangler dev`
[[kv_namespaces]]
binding = "ANALYTICS"
id = "0a795f32622a4e5b8baf18a0cba02ce6"
preview_id = "47b5ae181f684b5abdd1a54c918c08fc"

# ANALYTICS_ADMIN_KEY is NOT set here — it's a secret (gates the reset route
# server-side). Set it with:
#   npx wrangler secret put ANALYTICS_ADMIN_KEY
# Use the SAME value as REACT_APP_ANALYTICS_ADMIN_KEY in the site's .env.local.
